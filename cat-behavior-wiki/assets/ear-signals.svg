<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>貓咪耳朵訊號示意圖</title>
  <defs>
    <polygon id="earL" points="-50,-18 -44,-92 -6,-50" fill="#E9965A" stroke="#5B3A29" stroke-width="3" stroke-linejoin="round"/>
    <polygon id="earLin" points="-42,-30 -40,-76 -16,-48" fill="#F6C2B0"/>
    <g id="face">
      <circle cx="0" cy="0" r="58" fill="#E9965A" stroke="#5B3A29" stroke-width="3"/>
      <path d="M-6 14 h12 l-6 7 z" fill="#C9604B"/>
      <path d="M0 21 q-8 10 -16 4 M0 21 q8 10 16 4" stroke="#5B3A29" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M-24 16 l-34 -6 M-24 22 l-34 4 M24 16 l34 -6 M24 22 l34 4" stroke="#5B3A29" stroke-width="2"/>
    </g>
  </defs>
  <rect width="800" height="380" fill="#FFF8F0"/>
  <text x="400" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#3D2C23">耳朵要搭配全身姿勢判讀</text>

  <!-- 1 朝前 -->
  <g transform="translate(100 190)">
    <g><use href="#earL"/><use href="#earLin"/></g>
    <g transform="scale(-1 1)"><use href="#earL"/><use href="#earLin"/></g>
    <use href="#face"/>
    <ellipse cx="-22" cy="-10" rx="10" ry="12" fill="#F4E27A" stroke="#5B3A29" stroke-width="2"/>
    <ellipse cx="22" cy="-10" rx="10" ry="12" fill="#F4E27A" stroke="#5B3A29" stroke-width="2"/>
    <ellipse cx="-22" cy="-10" rx="3" ry="9" fill="#3D2C23"/>
    <ellipse cx="22" cy="-10" rx="3" ry="9" fill="#3D2C23"/>
  </g>
  <text x="100" y="310" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">直立朝前</text>
  <text x="100" y="336" text-anchor="middle" font-size="16" fill="#6B5446">放鬆或警覺時可能出現</text>

  <!-- 2 單耳轉向 -->
  <g transform="translate(300 190)">
    <g><use href="#earL"/><use href="#earLin"/></g>
    <g transform="scale(-1 1) rotate(-32 -30 -40)"><polygon points="-50,-18 -44,-92 -6,-50" fill="#D07A42" stroke="#5B3A29" stroke-width="3" stroke-linejoin="round"/></g>
    <use href="#face"/>
    <ellipse cx="-22" cy="-10" rx="10" ry="12" fill="#F4E27A" stroke="#5B3A29" stroke-width="2"/>
    <ellipse cx="22" cy="-10" rx="10" ry="12" fill="#F4E27A" stroke="#5B3A29" stroke-width="2"/>
    <ellipse cx="-18" cy="-10" rx="3" ry="9" fill="#3D2C23"/>
    <ellipse cx="26" cy="-10" rx="3" ry="9" fill="#3D2C23"/>
    <path d="M74 -96 q10 14 0 28 M86 -104 q16 22 0 44" stroke="#C9604B" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="300" y="310" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">耳朵朝前或朝後</text>
  <text x="300" y="336" text-anchor="middle" font-size="16" fill="#6B5446">警覺時可能出現</text>

  <!-- 3 飛機耳 -->
  <g transform="translate(500 190)">
    <g transform="rotate(-55 -30 -40)"><use href="#earL"/><use href="#earLin"/></g>
    <g transform="scale(-1 1) rotate(-55 -30 -40)"><use href="#earL"/><use href="#earLin"/></g>
    <use href="#face"/>
    <ellipse cx="-22" cy="-8" rx="11" ry="10" fill="#F4E27A" stroke="#5B3A29" stroke-width="2"/>
    <ellipse cx="22" cy="-8" rx="11" ry="10" fill="#F4E27A" stroke="#5B3A29" stroke-width="2"/>
    <ellipse cx="-22" cy="-8" rx="5" ry="8" fill="#3D2C23"/>
    <ellipse cx="22" cy="-8" rx="5" ry="8" fill="#3D2C23"/>
  </g>
  <text x="500" y="310" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">耳朵部分壓平</text>
  <text x="500" y="336" text-anchor="middle" font-size="16" fill="#6B5446">焦慮時可能出現</text>

  <!-- 4 壓平 -->
  <g transform="translate(700 190)">
    <g transform="translate(0 22) rotate(-82 -30 -40)"><use href="#earL"/></g>
    <g transform="scale(-1 1) translate(0 22) rotate(-82 -30 -40)"><use href="#earL"/></g>
    <use href="#face"/>
    <circle cx="-22" cy="-8" r="13" fill="#F4E27A" stroke="#5B3A29" stroke-width="2"/>
    <circle cx="22" cy="-8" r="13" fill="#F4E27A" stroke="#5B3A29" stroke-width="2"/>
    <circle cx="-22" cy="-8" r="10" fill="#3D2C23"/>
    <circle cx="22" cy="-8" r="10" fill="#3D2C23"/>
  </g>
  <text x="700" y="310" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">向後壓平貼頭</text>
  <text x="700" y="336" text-anchor="middle" font-size="16" fill="#6B5446">害怕時可能出現</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
