<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>貓咪慢眨眼示意圖</title>
  <rect width="820" height="300" fill="#FFF8F0"/>
  <text x="410" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#3D2C23">慢眨眼：可能的正向互動訊號</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9604B"/></marker>
  </defs>

  <!-- 1 睜眼 -->
  <g transform="translate(110 140)">
    <rect x="-80" y="-50" width="160" height="100" rx="24" fill="#E9965A" stroke="#5B3A29" stroke-width="3"/>
    <ellipse cx="-36" cy="0" rx="24" ry="18" fill="#F4E27A" stroke="#5B3A29" stroke-width="2.5"/>
    <ellipse cx="36" cy="0" rx="24" ry="18" fill="#F4E27A" stroke="#5B3A29" stroke-width="2.5"/>
    <ellipse cx="-36" cy="0" rx="5" ry="15" fill="#3D2C23"/>
    <ellipse cx="36" cy="0" rx="5" ry="15" fill="#3D2C23"/>
  </g>
  <text x="110" y="230" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">睜眼看著你</text>

  <!-- 2 半眨眼 -->
  <g transform="translate(310 140)">
    <rect x="-80" y="-50" width="160" height="100" rx="24" fill="#E9965A" stroke="#5B3A29" stroke-width="3"/>
    <ellipse cx="-36" cy="4" rx="24" ry="9" fill="#F4E27A" stroke="#5B3A29" stroke-width="2.5"/>
    <ellipse cx="36" cy="4" rx="24" ry="9" fill="#F4E27A" stroke="#5B3A29" stroke-width="2.5"/>
    <ellipse cx="-36" cy="4" rx="4" ry="7" fill="#3D2C23"/>
    <ellipse cx="36" cy="4" rx="4" ry="7" fill="#3D2C23"/>
  </g>
  <text x="310" y="230" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">幾次半眨眼</text>

  <!-- 3 閉眼 -->
  <g transform="translate(510 140)">
    <rect x="-80" y="-50" width="160" height="100" rx="24" fill="#E9965A" stroke="#5B3A29" stroke-width="3"/>
    <path d="M-60 2 q24 14 48 0 M12 2 q24 14 48 0" stroke="#3D2C23" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <text x="510" y="230" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">慢慢閉上</text>

  <!-- 4 瞇眼 -->
  <g transform="translate(710 140)">
    <rect x="-80" y="-50" width="160" height="100" rx="24" fill="#E9965A" stroke="#5B3A29" stroke-width="3"/>
    <ellipse cx="-36" cy="4" rx="24" ry="4" fill="#F4E27A" stroke="#5B3A29" stroke-width="2.5"/>
    <ellipse cx="36" cy="4" rx="24" ry="4" fill="#F4E27A" stroke="#5B3A29" stroke-width="2.5"/>
  </g>
  <text x="710" y="230" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">維持瞇眼</text>

  <path d="M196 140 h26" stroke="#C9604B" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M396 140 h26" stroke="#C9604B" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M596 140 h26" stroke="#C9604B" stroke-width="3" marker-end="url(#arr)"/>

  <text x="410" y="276" text-anchor="middle" font-size="16" fill="#6B5446">研究觀察到眼部回應與較高的靠近反應，仍有個體差異（Humphrey 等人，2020）</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
