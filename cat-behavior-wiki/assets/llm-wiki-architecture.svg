<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>貓咪行為學 LLM Wiki 架構圖</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5B3A29"/></marker>
  </defs>
  <rect width="900" height="470" fill="#FFF8F0"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#3D2C23">貓咪行為學 LLM Wiki 的三層架構</text>

  <!-- raw -->
  <rect x="40" y="120" width="220" height="200" rx="16" fill="#FFFFFF" stroke="#8C6E5D" stroke-width="2.5"/>
  <text x="150" y="156" text-anchor="middle" font-size="21" font-weight="700" fill="#3D2C23">raw/ 原始資料</text>
  <text x="150" y="186" text-anchor="middle" font-size="15" fill="#6B5446">五篇來源的書目與摘要</text>
  <text x="150" y="210" text-anchor="middle" font-size="15" fill="#6B5446">本次 5 篇</text>
  <text x="150" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#C9604B">只讀不改</text>
  <text x="150" y="276" text-anchor="middle" font-size="15" fill="#6B5446">（書目與重點紀錄）</text>

  <!-- wiki -->
  <rect x="340" y="100" width="240" height="240" rx="16" fill="#FCE3CF" stroke="#E9965A" stroke-width="3"/>
  <text x="460" y="136" text-anchor="middle" font-size="21" font-weight="700" fill="#3D2C23">wiki/ 知識頁面</text>
  <text x="460" y="170" text-anchor="middle" font-size="15" fill="#3D2C23">index 導覽　log 紀錄</text>
  <text x="460" y="196" text-anchor="middle" font-size="15" fill="#3D2C23">概念頁：尾巴、耳朵、</text>
  <text x="460" y="218" text-anchor="middle" font-size="15" fill="#3D2C23">眼睛、叫聲、姿勢</text>
  <text x="460" y="244" text-anchor="middle" font-size="15" fill="#3D2C23">誤解頁：常見迷思</text>
  <text x="460" y="270" text-anchor="middle" font-size="15" fill="#3D2C23">來源頁：每篇資料摘要</text>
  <text x="460" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#C9604B">由 AI 撰寫與維護</text>

  <!-- schema -->
  <rect x="660" y="120" width="200" height="200" rx="16" fill="#FFFFFF" stroke="#8C6E5D" stroke-width="2.5"/>
  <text x="760" y="156" text-anchor="middle" font-size="21" font-weight="700" fill="#3D2C23">AGENTS.md</text>
  <text x="760" y="190" text-anchor="middle" font-size="15" fill="#6B5446">Wiki 的規則書</text>
  <text x="760" y="222" text-anchor="middle" font-size="15" fill="#6B5446">頁面格式、用語、</text>
  <text x="760" y="244" text-anchor="middle" font-size="15" fill="#6B5446">引用與檢查規則、</text>
  <text x="760" y="266" text-anchor="middle" font-size="15" fill="#6B5446">ingest／query／lint 流程</text>

  <path d="M260 220 H334" stroke="#5B3A29" stroke-width="3" marker-end="url(#a)"/>
  <text x="297" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#3D2C23">Ingest</text>
  <path d="M660 220 H586" stroke="#5B3A29" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="623" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#3D2C23">規範</text>

  <!-- outputs -->
  <path d="M460 340 V384" stroke="#5B3A29" stroke-width="3" marker-end="url(#a)"/>
  <rect x="330" y="390" width="260" height="56" rx="14" fill="#3D2C23"/>
  <text x="460" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF8F0">查詢 Wiki，產生教學 HTML 簡報</text>

  <path d="M540 98 C540 64 380 64 380 92" stroke="#C9604B" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="566" y="82" text-anchor="start" font-size="15" font-weight="700" fill="#C9604B">Lint：檢查矛盾、缺來源、孤兒頁</text>
