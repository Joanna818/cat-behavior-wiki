<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" font-family="Noto Sans CJK TC, Noto Sans TC, Microsoft JhengHei, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>貓咪尾巴訊號示意圖</title>
  <defs>
    <g id="catbody">
      <ellipse cx="0" cy="45" rx="40" ry="50" fill="#E9965A" stroke="#5B3A29" stroke-width="3"/>
      <rect x="14" y="60" width="13" height="40" rx="6" fill="#E9965A" stroke="#5B3A29" stroke-width="3"/>
      <rect x="-4" y="62" width="13" height="38" rx="6" fill="#E9965A" stroke="#5B3A29" stroke-width="3"/>
      <polygon points="8,-40 10,-78 32,-52" fill="#E9965A" stroke="#5B3A29" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="36,-52 52,-76 52,-38" fill="#E9965A" stroke="#5B3A29" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="30" cy="-24" r="28" fill="#E9965A" stroke="#5B3A29" stroke-width="3"/>
      <ellipse cx="40" cy="-28" rx="3.5" ry="5" fill="#3D2C23"/>
      <path d="M52 -16 l5 3 l-5 3" fill="#C9604B"/>
      <path d="M-20 20 q8 -6 16 0 M-26 40 q8 -6 16 0" stroke="#C97A3E" stroke-width="3" fill="none"/>
    </g>
  </defs>
  <rect width="720" height="620" fill="#FFF8F0"/>
  <text x="360" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#3D2C23">貓咪的尾巴在說什麼？</text>

  <!-- 1 直立 -->
  <g transform="translate(130 190)">
    <path d="M-34 70 C-70 20 -66 -50 -52 -92 C-48 -104 -34 -106 -32 -94" stroke="#5B3A29" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M-34 70 C-70 20 -66 -50 -52 -92 C-48 -104 -34 -106 -32 -94" stroke="#E9965A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <use href="#catbody"/>
  </g>
  <text x="120" y="330" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">尾巴高高豎起</text>
  <text x="120" y="356" text-anchor="middle" font-size="16" fill="#6B5446">友善接近或探索時可能出現</text>

  <!-- 2 炸毛 -->
  <g transform="translate(370 190)">
    <path d="M-34 66 C-75 40 -78 -20 -60 -70" stroke="#5B3A29" stroke-width="34" fill="none" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M-34 66 C-75 40 -78 -20 -60 -70" stroke="#E9965A" stroke-width="24" fill="none" stroke-linecap="round"/>
    <use href="#catbody"/>
  </g>
  <text x="360" y="330" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">整條蓬起像刷子</text>
  <text x="360" y="356" text-anchor="middle" font-size="16" fill="#6B5446">受到驚嚇、害怕或防衛</text>

  <!-- 3 下垂夾住 -->
  <g transform="translate(610 190)">
    <path d="M-36 70 C-20 100 20 104 44 96" stroke="#5B3A29" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M-36 70 C-20 100 20 104 44 96" stroke="#E9965A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <use href="#catbody"/>
  </g>
  <text x="600" y="330" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">壓低、夾在身下</text>
  <text x="600" y="356" text-anchor="middle" font-size="16" fill="#6B5446">不安、緊張或害怕</text>

  <!-- 4 快速甩動 -->
  <g transform="translate(130 450)">
    <path d="M-36 72 C-70 74 -92 56 -100 30" stroke="#5B3A29" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M-36 72 C-70 74 -92 56 -100 30" stroke="#E9965A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M-112 10 q-10 22 4 44 M-122 2 q-14 30 6 60" stroke="#C9604B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <use href="#catbody"/>
  </g>
  <text x="120" y="590" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">用力甩動</text>
  <text x="120" y="612" text-anchor="middle" font-size="16" fill="#6B5446">可能煩躁，需搭配情境</text>

  <!-- 5 緩慢擺動 -->
  <g transform="translate(370 450)">
    <path d="M-36 72 C-62 80 -80 70 -92 52" stroke="#5B3A29" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M-36 72 C-62 80 -80 70 -92 52" stroke="#E9965A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M-104 44 q-6 10 0 20" stroke="#C9604B" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 4"/>
    <use href="#catbody"/>
  </g>
  <text x="360" y="590" text-anchor="middle" font-size="19" font-weight="700" fill="#3D2C23">專注時左右擺動</text>
  <text x="360" y="612" text-anchor="middle" font-size="16" fill="#6B5446">可能與準備撲向目標有關</text>

  <!-- 6 提示 -->
  <g transform="translate(600 470)">
    <rect x="-110" y="-90" width="220" height="190" rx="18" fill="#FCE3CF" stroke="#E9965A" stroke-width="2"/>
    <text x="0" y="-52" text-anchor="middle" font-size="20" font-weight="700" fill="#3D2C23">別只看尾巴！</text>
    <text x="0" y="-16" text-anchor="middle" font-size="16" fill="#3D2C23">尾巴只是線索之一，</text>
    <text x="0" y="10" text-anchor="middle" font-size="16" fill="#3D2C23">要搭配耳朵、眼睛、</text>
    <text x="0" y="36" text-anchor="middle" font-size="16" fill="#3D2C23">身體姿勢和當下情境</text>
    <text x="0" y="62" text-anchor="middle" font-size="16" fill="#3D2C23">一起判讀。</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
